name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            werror: "ON"
          - os: macos-latest
            werror: "OFF"
          - os: windows-latest
            werror: "OFF"
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM68K_WARNINGS_AS_ERRORS=${{ matrix.werror }}
      - name: Build
        shell: bash
        run: cmake --build build --config Release > build.log 2>&1 || { cat build.log; python3 tools/ci_annotate.py "build failed" build.log; }
      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure > test.log 2>&1 || { cat test.log; python3 tools/ci_annotate.py "tests failed" test.log; }; cat test.log

  sanitizers:
    name: AddressSanitizer + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DM68K_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  crosscheck:
    name: Cross-check against GNU binutils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install binutils for m68k
        run: sudo apt-get update && sudo apt-get install -y binutils-m68k-linux-gnu
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DM68K_BUILD_TOOLS=ON -DM68K_BUILD_TESTS=OFF && cmake --build build
      - name: Decoder against objdump (all 65536 opcode words)
        run: python3 tools/crosscheck_objdump.py build/m68k_dump_forms 0 3
      - name: Assembler against GNU as
        run: python3 tools/crosscheck_gas.py build/m68ktool

  emulator-diff:
    name: Emulator against Musashi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Differential test (all 65536 opcodes, random states; 20000 random instruction sequences)
        run: tools/run_diff_musashi.sh 10 1 20000
